name: Release

# Orchestrates a synced Mimic release:
#   1. resolve-version  — compute the next version (minor bump of the latest GitHub
#                         release, or 0.1.0 if none), write it to pyproject.toml, and
#                         commit + push so the file stays in sync
#   2. build-sandbox    — build & push the Docker Hub sandbox image (reusable workflow)
#   3. publish-pypi     — build & publish the mimic package to PyPI (trusted publishing)
#   4. github-release   — gated on ALL of the above succeeding; tags the bumped commit
#                         and creates the GitHub release (this becomes the "previous
#                         release" the next run bumps from)
#
# The GitHub release only happens if both the image and the PyPI package published,
# so a release never points at artifacts that failed to ship.
#
# Trigger: manual dispatch. Leave `explicit-version` empty for an automatic minor bump;
# set it to override (e.g. for a major or patch release).
# Requires: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets, a `pypi` environment with
# PyPI trusted publishing configured for this repo, and a `deploy-docker` environment.
# Note: pushes the version bump directly to the triggering branch — that branch must
# permit pushes by github-actions[bot] (no blocking branch-protection rule).

on:
  workflow_dispatch:
    inputs:
      explicit-version:
        description: "Override version (e.g. 1.0.0). Leave empty to auto-bump the minor."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.push.outputs.sha }}
    permissions:
      contents: write # commit + push the pyproject.toml version bump
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Compute next version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EXPLICIT_VERSION: ${{ github.event.inputs.explicit-version }}
        run: |
          set -euo pipefail
          if [ -n "$EXPLICIT_VERSION" ]; then
            version="$EXPLICIT_VERSION"
          else
            # Latest published release tag (vMAJOR.MINOR.PATCH); empty if none exist.
            latest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
            if [ -z "$latest" ]; then
              version="0.1.0"
            else
              base="${latest#v}"
              IFS='.' read -r major minor patch <<< "$base"
              : "${major:=0}"; : "${minor:=0}"
              version="${major}.$((minor + 1)).0"
            fi
          fi
          # Reject anything that isn't a plain semver X.Y.Z.
          case "$version" in
            *[!0-9.]*|"") echo "::error::Invalid version: '$version'"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next version: $version"

      - name: Write pyproject.toml and push
        id: push
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          # Update only the [project] version line (first `version = "..."`).
          perl -i -pe 'if (!$done && /^version = ".*"/) { $_ = "version = \"$ENV{VERSION}\"\n"; $done = 1 }' pyproject.toml
          grep -q "^version = \"${VERSION}\"" pyproject.toml || { echo "::error::Failed to set version in pyproject.toml"; exit 1; }

          if git diff --quiet pyproject.toml; then
            echo "pyproject.toml already at ${VERSION}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pyproject.toml
            git commit -m "chore: release ${VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-sandbox:
    name: Build sandbox image
    needs: resolve-version
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_build-sandbox.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
    secrets: inherit

  publish-pypi:
    name: Publish to PyPI
    needs: resolve-version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            astral.sh:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            rekor.sigstore.dev:443
            upload.pypi.org:443

      - name: Checkout (bumped commit)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve-version.outputs.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

  github-release:
    name: Create GitHub release
    needs: [resolve-version, build-sandbox, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            uploads.github.com:443

      - name: Checkout (bumped commit)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve-version.outputs.sha }}

      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: v${{ needs.resolve-version.outputs.version }}
          commit: ${{ needs.resolve-version.outputs.sha }}
          name: Mimic ${{ needs.resolve-version.outputs.version }}
          generateReleaseNotes: true
          draft: false
          prerelease: false
          body: |
            Mimic ${{ needs.resolve-version.outputs.version }}

            ## Install
            ```bash
            pip install mimic-qa==${{ needs.resolve-version.outputs.version }}
            # or run without installing:
            uvx --from mimic-qa mimic --project examples/minimal --list-pages
            ```

            The sandbox desktop image is published to Docker Hub:
            ```bash
            docker pull clidey/mimic-sandbox:${{ needs.resolve-version.outputs.version }}
            docker pull clidey/mimic-sandbox:latest
            ```

  summary:
    name: Release summary
    if: always()
    needs: [resolve-version, build-sandbox, publish-pypi, github-release]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block

      - name: Generate summary
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          SANDBOX: ${{ needs.build-sandbox.result }}
          PYPI: ${{ needs.publish-pypi.result }}
          RELEASE: ${{ needs.github-release.result }}
        run: |
          {
            echo "# Release ${VERSION}"
            echo ""
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Sandbox image (Docker Hub) | ${SANDBOX} |"
            echo "| PyPI package | ${PYPI} |"
            echo "| GitHub release | ${RELEASE} |"
          } >> "$GITHUB_STEP_SUMMARY"
