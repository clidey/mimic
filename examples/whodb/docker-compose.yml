# WhoDB infrastructure for mimic QA testing.
# The desktop sandbox is managed separately by the agent.

services:
  postgres:
    image: postgres:15
    container_name: mimic-postgres
    environment:
      POSTGRES_USER: whodb
      POSTGRES_PASSWORD: whodb
      POSTGRES_DB: whodb
    volumes:
      - ./assets/sample-data.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - mimic-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whodb"]
      interval: 2s
      timeout: 5s
      retries: 30

  whodb:
    image: clidey/whodb:latest
    container_name: mimic-whodb
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mimic-net

  ollama:
    image: ollama/ollama:latest
    container_name: mimic-ollama
    profiles: [ollama]
    networks:
      - mimic-net

networks:
  mimic-net:
    name: mimic-net
    external: true
