[project]
name = "docs-agent"
version = "0.3.0"
description = "Documentation QA agent — tests doc pages via computer-use with any project"
requires-python = ">=3.10"
dependencies = [
    "anthropic==0.112.0",
    "boto3==1.43.36",
    "openai==2.44.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.6",
    "mypy==1.15.0",
    "types-PyYAML==6.0.12.20250402",
    "boto3-stubs==1.38.1",
]

[project.scripts]
docs-agent = "docs_agent.__main__:main"
docs-agent-cloud = "docs_agent.cloud:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_agent"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "T20",   # flake8-print (flag print() in library code)
]
ignore = [
    "T201",  # allow print() — CLI tool uses it intentionally
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["docs_agent"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
