[project]
name = "docs-agent"
version = "0.2.0"
description = "Documentation QA agent — tests doc pages via computer-use with any project"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.82.0", "boto3>=1.35.0", "openai>=1.60.0", "pyyaml>=6.0"]

[project.scripts]
docs-agent = "docs_agent.__main__:main"
docs-agent-cloud = "docs_agent.cloud:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_agent"]
