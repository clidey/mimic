[project]
name = "whodb-docs-agent"
version = "0.1.0"
description = "WhoDB documentation QA agent — tests every doc page via computer-use"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.82.0"]

[project.scripts]
docs-agent = "docs_agent.__main__:main"
docs-agent-gcp = "docs_agent.gcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_agent"]
